version: "3.9"

services:
  api:
    build: .
    image: resume-generator-backend:latest
    container_name: resume-generator-api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      CORS_ORIGIN: "*"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      STORAGE: ${STORAGE:-memory}
      AUTH_MODE: ${AUTH_MODE:-off}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
